<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>附錄 1 · 程式實作 Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="deck" id="deck" aria-roledescription="簡報" aria-label="附錄 1 程式實作 Demo">
      <!-- 1 ─ 封面 ========================================================= -->
      <section class="slide slide--cover is-active" aria-roledescription="slide" aria-label="封面">
        <div class="cover">
          <p class="eyebrow rise">機密分享 · 期末報告</p>
          <h1 class="h1 rise">程式實作 Demo</h1>
          <p class="lede rise">
            投影片只是說明，這一頁就是程式本體。<br />
            不用安裝、不用後端 —— 拆一張圖，再用 k 張 share 把它拼回來。
          </p>
          <div class="cover__meta rise">
            <span class="tag tag--dark">APPENDIX 1</span>
            <span>安 · 蕭 · 妡</span>
            <span class="dot-sep"></span>
            <span>2026. 11</span>
          </div>
        </div>
        <div class="cover__ghost" aria-hidden="true">A1</div>
      </section>

      <!-- 2 ─ 實機 Demo ==================================================== -->
      <section class="slide" aria-roledescription="slide" aria-label="實機 Demo">
        <header class="slide__head">
          <p class="eyebrow rise">附錄 1-1 · 實機 Demo</p>
          <h2 class="h2 rise">直接玩：拆分 → 還原</h2>
          <p class="lede rise">
            這是 <span class="math">code/index.html</span> 本體，不是截圖。
            左邊拆分、右邊還原；湊滿 <span class="math">k</span> 張就能拿回原圖。
            技術選擇、架構與分工的說明請見「附錄 2 · 程式實作介紹」。
          </p>
        </header>

        <div class="slide__body stack">
          <div class="embed-shell rise">
            <iframe
              class="embed-frame"
              data-embed
              src="code/index.html?embed"
              title="Shamir 機密影像分享：拆分與還原的實際操作畫面"
              loading="eager"
            ></iframe>
          </div>
        </div>

        <style>
          /* 只用這一頁的 class，不動 style.css；:host 版本給 anim.js 的 shadow root 用 */
          .embed-shell {
            height: 452px;
            overflow: hidden;
            border-radius: var(--radius);
            background: var(--paper);
            box-shadow: inset 0 0 0 1px var(--line), 0 18px 40px rgba(18, 26, 43, 0.12);
          }

          .embed-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
          }

          :host(.slide) .embed-shell {
            height: 452px;
            overflow: hidden;
            border-radius: var(--radius);
            background: var(--paper);
            box-shadow: inset 0 0 0 1px var(--line), 0 18px 40px rgba(18, 26, 43, 0.12);
          }

          :host(.slide) .embed-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
          }
        </style>
      </section>
    </main>

    <nav class="hud" aria-label="投影片控制">
      <div class="hud__bar">
        <span class="hud__progress" aria-hidden="true"><i></i></span>
        <span class="hud__count" aria-live="polite">01 / 02</span>
        <button class="hud__btn" type="button" data-nav="prev" aria-label="上一頁" title="上一頁（← ↑）">←</button>
        <button class="hud__btn" type="button" data-nav="next" aria-label="下一頁" title="下一頁（→ ↓）">→</button>
        <button class="hud__btn" type="button" data-nav="fullscreen" aria-label="全螢幕" title="全螢幕（F）">
          <svg
            width="14"
            height="14"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 2H2v4M10 2h4v4M14 10v4h-4M2 10v4h4" />
          </svg>
        </button>
      </div>
    </nav>

    <!-- 播放器 → 頁內 step 播放器 → 把嵌入的 Demo 導覽鍵轉給播放器 -->
    <script src="deck.js"></script>
    <script src="anim.js"></script>
    <script src="embed.js"></script>
  </body>
</html>
