<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Shamir 機密分享 · 簡報</title>
    <!-- 與各章節共用同一支樣式檔；章節檔本身也載入 style.css，單獨開啟時一樣正常 -->
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ---------------------------------------------------------------------
         只有 index.html 用得到的「載入中 / 載入失敗」畫面。
         其餘視覺一律走 style.css，這裡不重複定義顏色與字體。
         --------------------------------------------------------------------- */
      .boot {
        max-width: 44rem;
        padding: 0 24px;
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1.9;
        letter-spacing: 0.04em;
        text-align: center;
        color: var(--ink-500);
      }

      .boot__title {
        margin-bottom: 6px;
        font-family: var(--font-sans);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--ink-900);
      }

      .boot__hint {
        margin-top: 14px;
        text-align: left;
        font-size: 12.5px;
        line-height: 1.8;
      }

      .boot__hint code,
      .boot p code {
        padding: 1px 6px;
        border-radius: 6px;
        background: var(--brand-soft);
        font-family: inherit;
        color: var(--brand-600);
      }

      /* 載入中的三顆小圓點（載入失敗時自動收起來） */
      .boot__dots {
        display: inline-flex;
        gap: 5px;
        margin-top: 14px;
      }

      .boot--error .boot__dots {
        display: none;
      }

      .boot__dots > i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brand);
        animation: boot-blink 1.1s ease-in-out infinite;
      }

      .boot__dots > i:nth-child(2) {
        animation-delay: 0.15s;
      }

      .boot__dots > i:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes boot-blink {
        0%,
        70%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        35% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot__dots > i {
          animation: none;
          opacity: 0.6;
        }
      }

      @media print {
        .boot {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- 章節載入完成後會從 DOM 移除 -->
    <div class="boot" id="boot" role="status" aria-live="polite">
      <p class="boot__title">Shamir 機密分享</p>
      <p id="boot-text">載入簡報…</p>
      <p class="boot__dots" aria-hidden="true"><i></i><i></i><i></i></p>
    </div>

    <noscript>
      <div class="boot">
        <p class="boot__title">需要 JavaScript</p>
        <p>這份簡報靠 JavaScript 載入章節與翻頁，請開啟瀏覽器的 JavaScript。</p>
      </div>
    </noscript>

    <!-- 播放器：章節檔與 index 共用同一支；這裡先載入，等章節合併完再呼叫 SlideDeck.init() -->
    <script src="deck.js"></script>
    <!-- 頁內 step 播放器：必須比 deck.js 晚載入（keydown 的 capture listener 後註冊者先執行） -->
    <script src="anim.js"></script>
    <!-- 附錄「程式實作」的實機 Demo：把 code/ 的按鍵轉給播放器（沒有 iframe 時什麼都不做） -->
    <script src="embed.js"></script>

    <script>
      /*
       * 章節載入器：把所有章節合成「同一份 deck」的簡報。
       *
       * 做法：
       *   1. 依 CHAPTERS 的章節編號順序，把每個章節檔都 fetch 進來，用 DOMParser 解析
       *      （解析不會執行任何東西），並數出每章有幾張 .slide。
       *   2. 依序累加頁碼：第 1 章從第 1 頁開始，下一章接在前一章最後一頁後面。
       *      例：第 1 章 6 張（1–6）、第 6 章 6 張（7–12），整份簡報共 12 頁。
       *      之後在中間插入新章節，只要在 CHAPTERS 多加一筆，後面頁碼會自動往後推。
       *   3. 把所有章節的 .slide 依序放進同一個 #deck，控制列只插一次。
       *      圖形樣式（例如 fill: url(#grid6)）是 style.css 直接以 id 參照，
       *      所以各章 SVG defs 的 id 要保持唯一，合併時不改名。
       *   4. 最後呼叫 deck.js 的 SlideDeck.init()：頁碼是整份簡報的 1–N，
       *      換章節、翻頁都只是換投影片，不會再重新載入任何檔案。
       *
       * 之後要加其他章：在 CHAPTERS 多加一筆即可（目前有 1、6）。
       * ?chapter=N 決定從哪一章的第一頁開始；#頁碼 則是合併後的全域頁碼。
       */
      (function () {
        var CHAPTERS = {
          1: { file: "chapter1.html", label: "第 1 章", name: "Shamir 多項式的原理" },
          2: { file: "chapter2.html", label: "第 2 章", name: "Shamir 多項式的嚴謹定義" },
          3: { file: "chapter3.html", label: "第 3 章", name: "為什麼需要 Galois Field？" },
          4: { file: "chapter4.html", label: "第 4 章", name: "Galois Field 性質與運算" },
          6: { file: "chapter6.html", label: "第 6 章", name: "實作機密影像分享" },
          7: { file: "chapter7.html", label: "附錄 1", name: "程式實作介紹" },
        };

        var boot = document.getElementById("boot");
        var bootText = document.getElementById("boot-text");

        function bootError(message, hint) {
          if (!boot) return;
          boot.classList.add("boot--error");
          boot.innerHTML =
            '<p class="boot__title">載入失敗</p>' +
            "<p>" + message + "</p>" +
            (hint ? '<p class="boot__hint">' + hint + "</p>" : "");
          bootText = null;
        }

        function requestedChapter() {
          var query = new URLSearchParams(location.search);
          var n = parseInt(query.get("chapter"), 10);
          return CHAPTERS[n] ? n : 1;
        }

        function chapterKeys() {
          return Object.keys(CHAPTERS)
            .map(Number)
            .sort(function (a, b) {
              return a - b;
            });
        }

        function fetchChapter(key) {
          var file = CHAPTERS[key].file;
          return fetch(file, { cache: "no-cache" })
            .then(function (response) {
              if (!response.ok) {
                throw new Error(
                  file + " 回應 " + response.status + " " + response.statusText
                );
              }
              return response.text();
            })
            .then(function (html) {
              if (!/^\s*<!DOCTYPE/i.test(html) && html.indexOf("<main") === -1) {
                throw new Error(file + " 的內容不是章節頁面");
              }
              var parsed = new DOMParser().parseFromString(html, "text/html");
              var slides = parsed.querySelectorAll(".slide").length;
              if (!slides) throw new Error(file + " 裡找不到 .slide");
              return { key: key, parsed: parsed, slides: slides };
            });
        }

        // 依章節順序把頁碼接起來（中間插入新章節時，後面頁碼會自動往後推）
        function mergePages(entries) {
          var total = 0;
          entries.forEach(function (entry) {
            entry.offset = total; // 本章第一張之前已經有幾頁
            entry.first = total + 1; // 本章第一頁（合併後的頁碼）
            entry.last = total + entry.slides;
            total += entry.slides;
          });
          return total;
        }

        // 章節切換：只在 index 插入控制列；連結直接跳到該章第一頁，不會重新載入
        function mountChapterSwitch(entries) {
          var bar = document.querySelector(".hud__bar");
          if (!bar) return;

          var group = document.createElement("div");
          group.className = "hud__chapters";
          group.setAttribute("role", "group");
          group.setAttribute("aria-label", "章節");

          entries.forEach(function (entry) {
            var chapter = CHAPTERS[entry.key];
            var label = chapter.name ? chapter.label + " · " + chapter.name : chapter.label;
            var link = document.createElement("a");
            link.className = "hud__chapter";
            link.href = "#" + entry.first;
            link.textContent = "CH." + entry.key;
            link.title = label + "（第 " + entry.first + "–" + entry.last + " 頁）";
            link.setAttribute("data-chapter", String(entry.key));
            group.appendChild(link);
          });

          bar.appendChild(group);
          document.body.classList.add("has-chapters");
        }

        function chapterOfPage(entries, page) {
          for (var i = 0; i < entries.length; i++) {
            if (page <= entries[i].last) return entries[i];
          }
          return entries[entries.length - 1];
        }

        // 換頁時同步：章節鈕選中狀態、視窗標題、網址（?chapter=N#頁碼）
        function syncChrome(entries, page) {
          var current = chapterOfPage(entries, page);

          Array.prototype.forEach.call(
            document.querySelectorAll(".hud__chapter"),
            function (link) {
              if (link.getAttribute("data-chapter") === String(current.key)) {
                link.setAttribute("aria-current", "page");
              } else {
                link.removeAttribute("aria-current");
              }
            }
          );

          var chapter = CHAPTERS[current.key];
          var title = chapter.name ? chapter.label + " · " + chapter.name : chapter.label;
          if (document.title !== title) document.title = title;

          if (window.history && history.replaceState) {
            history.replaceState(null, "", "?chapter=" + current.key + "#" + page);
          }
        }

        function mount(entries, target) {
          if (!window.SlideDeck) {
            bootError("找不到 <code>deck.js</code>，無法啟動播放器。");
            return;
          }

          // 把所有章節的 .slide 依序放進同一個舞台：之後換頁不必再載入任何檔案
          var deck = document.createElement("main");
          deck.className = "deck";
          deck.id = "deck";
          deck.setAttribute("aria-roledescription", "簡報");
          deck.setAttribute("aria-label", "Shamir 機密分享");

          entries.forEach(function (entry) {
            Array.prototype.forEach.call(
              entry.parsed.querySelectorAll(".slide"),
              function (slide) {
                deck.appendChild(document.importNode(slide, true));
              }
            );
          });

          document.body.appendChild(deck);

          // 控制列各章相同，取目標章節那份插一次就好
          var hud = target.parsed.querySelector(".hud");
          if (hud) document.body.appendChild(document.importNode(hud, true));

          mountChapterSwitch(entries);

          // 啟動播放器：從目標章節第一頁開始，換頁時同步章節鈕／標題／網址
          window.SlideDeck.init({
            page: target.first,
            onChange: function (page) {
              syncChrome(entries, page);
            },
          });

          // 啟動頁內 step（anim.js）：必須在 SlideDeck.init() 之後，第一個進入的頁面
          // 才會從第 0 步開始；沒載入 anim.js 時整份簡報仍能正常翻頁
          if (window.SlideSteps) window.SlideSteps.boot();

          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }

        function load(n) {
          if (bootText) bootText.textContent = "載入簡報…";

          // 全部章節都要抓：先數張數，才知道每一章的頁碼從第幾頁開始
          Promise.all(chapterKeys().map(fetchChapter))
            .then(function (entries) {
              mergePages(entries);
              var target = entries.filter(function (entry) {
                return entry.key === n;
              })[0];
              mount(entries, target);
            })
            .catch(function (error) {
              bootError(
                "載入章節失敗：" + error.message,
                "如果是直接雙擊打開 index.html（file://），瀏覽器會因為安全性限制擋下 " +
                  "<code>fetch()</code>。請改用本機伺服器：<br />" +
                  "<code>python3 -m http.server 8000</code><br />" +
                  "然後開啟 <code>http://localhost:8000/</code>；放上 GitHub Pages 就沒有這個問題。"
              );
            });
        }

        load(requestedChapter());
      })();
    </script>
  </body>
</html>
